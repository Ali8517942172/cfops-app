<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Phones: lay the dashboard out at 1024 px (the screens are desktop designs); pinch to zoom. Tablets/desktops: real width.
  (function () { var w = Math.min(screen.width, screen.height); document.write('<meta name="viewport" content="' + (w < 900 ? 'width=1024' : 'width=device-width, initial-scale=1') + '">'); })();
</script>
<title>CF OPS</title>
<meta name="description" content="ConvoFlow ops dashboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1a40c2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CF OPS">
<style>
  html, body { margin: 0; height: 100%; background: #f7f8fc; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #off { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; font: 16px/1.5 system-ui, sans-serif; color: #333; background: #f7f8fc; text-align: center; padding: 24px; }
</style>
</head>
<body>
<iframe id="f" title="CF OPS" allow="clipboard-write"></iframe>
<div id="off">You are offline. CF OPS will load again when the connection is back.</div>
<script>
  // Thin app shell: the dashboard itself is served live from n8n, so every change shows here at once.
  var BASE = 'https://primary-production-3cd9.up.railway.app/webhook/cf-ops';
  var KEY = 'cfops_token';
  function get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function put(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }
  var f = document.getElementById('f'), tok = get();
  var q = new URLSearchParams(location.search), p = q.get('p') || (tok ? 'command' : 'signin');
  q.delete('p'); var rest = q.toString();
  f.name = tok ? 'cfops:' + tok : '';            // the dashboard keeps its session in window.name
  f.src = BASE + '?p=' + encodeURIComponent(p) + (rest ? '&' + rest : '') + location.hash;
  // the dashboard tells the shell when someone signs in or out, so the login survives closing the app
  window.addEventListener('message', function (e) {
    if (e.source !== f.contentWindow) return;
    var d = e.data || {};
    if (d.cfops === 'token') put(typeof d.token === 'string' ? d.token : '');
    // the dashboard page runs on an opaque (sandboxed) origin, so the reply goes to that exact frame with '*'
    if (d.cfops === 'need-token') e.source.postMessage({ cfops: 'token-set', token: get() }, '*');
  });
  function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'flex'; }
  window.addEventListener('online', function () { net(); f.src = f.src; });
  window.addEventListener('offline', net); net();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
